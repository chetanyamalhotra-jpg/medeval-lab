[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medeval-lab"
version = "0.6.0"
description = "Independent, open-source Medical AI Evaluation Lab: benchmark auditing, literature-traced criteria, metrics, judge testing and reliability analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "medeval-lab contributors" }]
keywords = ["medical-ai", "evaluation", "llm-as-judge", "reliability", "benchmark-audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "playwright>=1.40"]

[project.scripts]
medeval = "medeval.cli:main"

[project.entry-points."lm_eval.metrics"]
"medeval_acc" = "medeval_metrics.plugins:medeval_acc_metric"
"medeval_brier" = "medeval_metrics.plugins:medeval_brier_metric"
"medeval_nll" = "medeval_metrics.plugins:medeval_nll_metric"
"medeval_mean_confidence" = "medeval_metrics.plugins:medeval_mean_confidence_metric"

[project.entry-points."lm_eval.aggregations"]
"medeval_worst_decile" = "medeval_metrics.plugins:medeval_worst_decile"
"medeval_trimmed_mean" = "medeval_metrics.plugins:medeval_trimmed_mean"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
medeval_core = ["schemas/*.json"]
medeval_criteria = ["catalogue/**/*.yaml"]
medeval_judges = ["rules/*.yaml", "prompts/*.txt"]
medeval_metrics = ["templates/*.yaml"]
medeval_web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cache provider writes into a temp directory that restricted Windows tokens
# cannot read back, so it is disabled rather than left to warn on every run.
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:medeval.*"]
markers = [
    "allow_loopback: this test may talk to a local fake server on 127.0.0.1 (never to a real endpoint)",
    "browser: end-to-end test in a real headless browser (skipped when no browser can start)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["packages", "tests", "experiments", "scripts"]
extend-exclude = [
    ".venv",
    "hf",
    "results",
    "data",
    "experiments/002a_pairwise_blocked",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = [
    "E501",   # line length is handled by the formatter, not by the linter
    "RUF001", # ambiguous unicode is intentional in report text
    "RUF002",
    "RUF003",
    "PT011",  # pytest.raises without match is fine for simple checks
    "SIM117", # nested with statements are clearer than a 4-line parenthesised with
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PT"]
"experiments/*" = ["SIM", "C4"]
"scripts/*" = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = [
    "medeval",
    "medeval_audit",
    "medeval_core",
    "medeval_criteria",
    "medeval_judges",
    "medeval_metrics",
    "medeval_packs",
    "medeval_reliability",
    "medeval_study",
    "medeval_web",
]

[tool.coverage.run]
source = ["packages"]
